name: Deploy DragonCraft STEM Game to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript and run question tests (blocks a broken deploy)
        run: |
          node --check questions.js && node --check game.js && node --check parent.js && node --check sw.js
          node tests/questions.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp cache-busting version
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" index.html
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
